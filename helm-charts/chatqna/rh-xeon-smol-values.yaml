# Global configuration
global:
  HUGGINGFACEHUB_API_TOKEN: "${HFTOKEN}"
  HF_TOKEN: "${HFTOKEN}"

# Model downloader configuration
modelDownloader:
  securityContext:
    runAsUser: 1001080000
    runAsGroup: 1001080000
    allowPrivilegeEscalation: false
    capabilities:
      add:
        - DAC_OVERRIDE
        - FOWNER
      drop:
        - ALL

# LLM Configuration - Using vLLM
tgi:
  enabled: false  # Disable TGI since we're using vLLM
vllm:
  enabled: true
  LLM_MODEL_ID: "HuggingFaceTB/SmolLM-360M-Instruct"  # Using SmolLM 360M model
  port: 8000
  shmSize: 32Gi  # Reduced from 128Gi since this is a much smaller model
  # Configure vLLM resources optimized for Xeon processors
  # Significantly reduced from Llama configuration since this is a much smaller model
  resources:
    requests:
      cpu: "8"
      memory: "16Gi"
    limits:
      cpu: "16"
      memory: "24Gi"

# TEI embedding service configuration
tei:
  enabled: true
  EMBEDDING_MODEL_ID: "BAAI/bge-base-en-v1.5"
  # Resources optimized for Xeon processors
  resources:
    requests:
      cpu: "8"
      memory: "16Gi"
    limits:
      cpu: "16"
      memory: "24Gi"
  service:
    port: 80  # Service port (forwards to container port 2081)
    targetPort: 2081  # Container port where TEI listens

# TEI reranking service configuration
teirerank:
  enabled: true
  RERANK_MODEL_ID: "BAAI/bge-reranker-base"
  # Resources optimized for Xeon processors
  resources:
    requests:
      cpu: "8"
      memory: "16Gi"
    limits:
      cpu: "16"
      memory: "24Gi"
  service:
    port: 80  # Service port (forwards to container port 2082)
    targetPort: 2082  # Container port where TEIRerank listens

# Security context for OpenShift compatibility
podSecurityContext:
  fsGroup: 1001080000
securityContext:
  runAsUser: 1001080000
  runAsGroup: 1001080000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
