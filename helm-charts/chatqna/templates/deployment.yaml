apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chatqna.fullname" . }}
  labels:
    {{- include "chatqna.labels" . | nindent 4 }}
    app: {{ include "chatqna.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chatqna.selectorLabels" . | nindent 6 }}
      app: {{ include "chatqna.fullname" . }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chatqna.selectorLabels" . | nindent 8 }}
        app: {{ include "chatqna.fullname" . }}
    spec:
      imagePullSecrets:
      - name: regcred
      serviceAccountName: ed-chatqna
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: model-downloader
        image: huggingface/downloader:0.17.3
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "echo 'Huggingface log in ...'; huggingface-cli login --token $(HF_TOKEN); echo 'Download model BAAI/bge-reranker-base ... '; huggingface-cli download --cache-dir /data 'BAAI/bge-reranker-base'; echo 'Change model files mode ...'; chmod -R g+w /data/models--BAAI--bge-reranker-base; sudo chown -R 1001080000:0 '/.npm'"]
        envFrom:
        - configMapRef:
            name: ed-chatqna-tei-config
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - DAC_OVERRIDE
            - FOWNER
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: model-volume
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access-xdcqf
          readOnly: true
      containers:
        - name: {{ .Release.Name }}
          env:
            - name: LLM_SERVER_HOST_IP
              # For FaqGen, llm-uservice is used.
              {{- if eq .Values.CHATQNA_TYPE "CHATQNA_FAQGEN"}}
              value: {{ .Release.Name }}-llm-uservice
              {{- else }}
              {{- if .Values.vllm.enabled }}
              value: {{ .Values.vllm.LLM_MODEL_ID | quote }}
              {{- else }}
              value: {{ .Values.tgi.LLM_MODEL_ID | quote }}
              {{- end }}
              {{- end }}
            - name: LLM_SERVER_PORT
              {{/*Ed: modified to 8080*/}}
              value: "8080"
            - name: LLM_MODEL
              {{- if .Values.vllm.enabled }}
              value: {{ .Values.vllm.LLM_MODEL_ID | quote }}
              {{- else }}
              value: {{ .Values.tgi.LLM_MODEL_ID | quote }}
              {{- end }}
            - name: RERANK_SERVER_HOST_IP
              value: {{ .Release.Name }}-teirerank
            - name: RERANK_SERVER_PORT
              {{/*Ed: modified to 8080*/}}
              value: "8080"
            - name: RETRIEVER_SERVICE_HOST_IP
              value: {{ .Release.Name }}-retriever-usvc
            - name: RETRIEVER_SERVICE_PORT
              value: "7000"
            - name: EMBEDDING_SERVER_HOST_IP
              value: {{ .Release.Name }}-tei
            - name: EMBEDDING_SERVER_PORT
              {{/*Ed: modified to 8080*/}}
              value: "8080"
            - name: GUARDRAIL_SERVICE_HOST_IP
              value: {{ .Release.Name }}-guardrails-usvc
            - name: GUARDRAIL_SERVICE_PORT
              value: "9090"
            - name: LLM_SERVICE_HOST_IP
              value: {{ .Release.Name }}-llm-uservice
            - name: LLM_SERVICE_PORT
              value: "9000"
            - name: RERANK_SERVICE_HOST_IP
              value: {{ .Release.Name }}-reranking-usvc
            - name: RERANK_SERVICE_PORT
              value: "8000"
            - name: EMBEDDING_SERVICE_HOST_IP
              value: {{ .Release.Name }}-embedding-usvc
            - name: EMBEDDING_SERVICE_PORT
              value: "6000"
            {{- if .Values.LOGFLAG }}
            - name: LOGFLAG
              value: {{ .Values.LOGFLAG | quote }}
            {{- end }}
            {{- if .Values.CHATQNA_TYPE }}
            - name: CHATQNA_TYPE
              value: {{ .Values.CHATQNA_TYPE | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            runAsUser: 1001080000
            runAsGroup: 0
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          ports:
            - name: chatqna
              containerPort: {{ .Values.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: model-volume
          persistentVolumeClaim:
            claimName: model-volume
        - name: kube-api-access-xdcqf
          projected:
            defaultMode: 420
            sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                items:
                - key: ca.crt
                  path: ca.crt
                name: kube-root-ca.crt
            - downwardAPI:
                items:
                - fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
                  path: namespace
            - configMap:
                items:
                - key: service-ca.crt
                  path: service-ca.crt
                name: openshift-service-ca.crt
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.evenly_distributed }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "chatqna.selectorLabels" . | nindent 14 }}
              app: {{ include "chatqna.fullname" . }}
      {{- end }}
