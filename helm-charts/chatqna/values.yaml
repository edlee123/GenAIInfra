# Default values for chatqna.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: opea/chatqna-ui
#   # Uncomment the following line to set desired image pull policy if needed, as one of Always, IfNotPresent, Never.
#   pullPolicy: "IfNotPresent"
#   # Overrides the image tag whose default is the chart appVersion.
  tag: "1.2"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true

  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault
  # Below false works when combined with privileged oc account.
  # oc adm policy add-scc-to-user privileged -z <my service account> -n <my namespace>
  privileged: false

# Container port
port: 8888
service:
  type: ClusterIP
  port: 8888

nodeSelector: {}

tolerations: []

affinity: {}

# This is just to avoid Helm errors when HPA is NOT used
# (use hpa-values.yaml files to actually enable HPA).
autoscaling:
  enabled: false



# Optional subcharts enablement and subcharts settings overwritten
# LLM choice, tgi by default.
tgi:
  enabled: false
  LLM_MODEL_ID: meta-llama/Meta-Llama-3-8B-Instruct
vllm:
  # Default is vllm
  enabled: false
  LLM_MODEL_ID: meta-llama/Meta-Llama-3-8B-Instruct
  shmSize: 128Gi
  VLLM_TORCH_PROFILER_DIR: "/tmp/vllm_profile"
data-prep:
  # the following are for redis-vector-db
  DATAPREP_BACKEND: "REDIS"
  INDEX_NAME: "rag-redis"
  # the following are for qdrant db
  COLLECTION_NAME: "rag-qdrant"
  QDRANT_PORT: 6333
  # the following are for milvus db
  MILVUS_PORT: 19530
retriever-usvc:
  # the following are for redis-vector-db
  RETRIEVER_BACKEND: "REDIS"
  INDEX_NAME: "rag-redis"
  # the following are for qdrant db
  QDRANT_INDEX_NAME: "rag-qdrant"
  QDRANT_PORT: 6333
  # the following are for milvus db
  MILVUS_PORT: 19530
teirerank:
  enabled: true
  port: 2082


# ModelCar endpoints configuration (commented out until ModelCar is available)
# If uncommented will override the default endpoints for LLM, embedding, and reranker in deployment_modelcar.yaml
modelcar:
  endpoints:
    llm:
      host: "granite-predictor-00001.ed-opea-modelcar.svc.cluster.local"
      port: "80"


# Woudl create values files per compute x model combinations.
# export EMBEDDING_MODEL_ID="BAAI/bge-base-en-v1.5"
# export RERANK_MODEL_ID="BAAI/bge-reranker-base"


# vector db choice
# redis by default.
redis-vector-db:
  enabled: true
# qdrant, disabled by default
qdrant:
  enabled: false
  tag: "v1.13.1"
  config:
    cluster:
      enabled: false
milvus:
  enabled: false
  # Milvus config for standalone mode with no PVC which has minimum requirements for the K8s cluster.
  # Check https://github.com/zilliztech/milvus-helm/tree/milvus-4.2.12/charts/milvus for more production level configuration.
  cluster:
    enabled: false
  etcd:
    replicaCount: 1
    persistence:
      enabled: false
  pulsar:
    enabled: false
  minio:
    mode: standalone
    persistence:
      enabled: false
  standalone:
    persistence:
      enabled: false
# Microservice layer, disabled by default
llm-uservice:
  enabled: false
  TEXTGEN_BACKEND: "vLLM"
  LLM_MODEL_ID: meta-llama/Meta-Llama-3-8B-Instruct
embedding-usvc:
  enabled: false
  EMBEDDING_BACKEND: "TEI"
reranking-usvc:
  enabled: false
  RERANK_BACKEND: "TEI"

# Below imagePullSecrets is required for pulling images from private docker registry.
nginx:
  service:
    type: NodePort

# Uncomment the following lines
chatqna-ui:
  image:
    # modified image for redhat security
    repository: edlee123/chatqna-ui
    tag: "latest"
  containerPort: "5173"

# disable guardrails by default
# See guardrails-values.yaml for guardrail related options
guardrails-usvc:
  enabled: false
tgi-guardrails:
  enabled: false

dashboard:
  prefix: "OPEA ChatQnA"

global:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  HUGGINGFACEHUB_API_TOKEN: ""
  imagePullSecrets:
    - name: regcred
  

  # service account name to be shared with all parent/child charts.
  # If set, it will overwrite serviceAccount.name.
  # If set, and serviceAccount.create is false, it will assume this service account is already created by others.
  sharedSAName: "ed-chatqna"
  # set modelUseHostPath or modelUsePVC to use model cache.
  # modelUseHostPath: "/mnt/opea-models"
  # modelUseHostPath: /mnt/opea-models
  modelUsePVC: model-volume

  # imagePullSecrets:
  # # For docker hub pulling images without hitting rate limit.
  #   - name: regcred
  # Prometheus monitoring + Grafana dashboard(s) for service components?
  monitoring: false

  # Prometheus/Grafana namespace for Dashboard installation
  prometheusNamespace: monitoring

  # Prometheus Helm install release name needed for serviceMonitors
  prometheusRelease: prometheus-stack
