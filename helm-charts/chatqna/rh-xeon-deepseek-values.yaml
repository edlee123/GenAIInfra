# Global configuration
global:
  HUGGINGFACEHUB_API_TOKEN: "${HFTOKEN}"
  HF_TOKEN: "${HFTOKEN}"

# LLM Configuration - Using vLLM
tgi:
  enabled: false  # Disable TGI since we're using vLLM
vllm:
  enabled: true
  LLM_MODEL_ID: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"  # Using DeepSeek R1 Distill Qwen 1.5B model
  port: 8000
  shmSize: 96Gi  # Adjusted for 1.5B parameter model (between 64Gi for 0.5B and 128Gi for 8B)
  # Configure vLLM resources optimized for Xeon processors
  # Adjusted for a 1.5B parameter model
  resources:
    requests:
      cpu: "24"
      memory: "48Gi"
    limits:
      cpu: "32"
      memory: "64Gi"

# TEI embedding service configuration
tei:
  enabled: true
  port: 2081
  EMBEDDING_MODEL_ID: "BAAI/bge-base-en-v1.5"
  # Resources optimized for Xeon processors
  resources:
    requests:
      cpu: "8"
      memory: "16Gi"
    limits:
      cpu: "16"
      memory: "24Gi"

# TEI reranking service configuration
teirerank:
  enabled: true
  port: 2082
  RERANK_MODEL_ID: "BAAI/bge-reranker-base"
  # Resources optimized for Xeon processors
  resources:
    requests:
      cpu: "8"
      memory: "16Gi"
    limits:
      cpu: "16"
      memory: "24Gi"

# Security context for OpenShift compatibility
podSecurityContext:
  fsGroup: 1001080000
securityContext:
  runAsUser: 1001080000
  runAsGroup: 1001080000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL