# Global configuration
global:
  HUGGINGFACEHUB_API_TOKEN: "${HFTOKEN}"
  HF_TOKEN: "${HFTOKEN}"

# LLM Configuration - Using vLLM
tgi:
  enabled: false  # Disable TGI since we're using vLLM
vllm:
  enabled: true
  LLM_MODEL_ID: "Qwen/Qwen2.5-0.5B-Instruct"  # Using Qwen 2.5 0.5B model
  port: 8000
  shmSize: 64Gi  # Reduced from 128Gi since this is a smaller model
  # Configure vLLM resources optimized for Xeon processors
  # Reduced from the Llama configuration since this is a smaller model
  resources:
    requests:
      cpu: "16"
      memory: "32Gi"
    limits:
      cpu: "24"
      memory: "48Gi"

# TEI embedding service configuration
tei:
  enabled: true
  port: 2081
  EMBEDDING_MODEL_ID: "BAAI/bge-base-en-v1.5"
  # Resources optimized for Xeon processors
  resources:
    requests:
      cpu: "8"
      memory: "16Gi"
    limits:
      cpu: "16"
      memory: "24Gi"

# TEI reranking service configuration
teirerank:
  enabled: true
  port: 2082
  RERANK_MODEL_ID: "BAAI/bge-reranker-base"
  # Resources optimized for Xeon processors
  resources:
    requests:
      cpu: "8"
      memory: "16Gi"
    limits:
      cpu: "16"
      memory: "24Gi"

# Security context for OpenShift compatibility
podSecurityContext:
  fsGroup: 1001080000
securityContext:
  runAsUser: 1001080000
  runAsGroup: 1001080000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL