# Global configuration
global:
  HUGGINGFACEHUB_API_TOKEN: "${HFTOKEN}"
  HF_TOKEN: "${HFTOKEN}"

# LLM Configuration - Using vLLM
tgi:
  enabled: false  # Disable TGI since we're using vLLM
vllm:
  enabled: true
  LLM_MODEL_ID: "meta-llama/Meta-Llama-3-8B-Instruct"
  port: 8000
  shmSize: 128Gi
  # Configure vLLM resources
  # Temporarily set resources high to test Meta-Llama-3-8B-Instruct
  # This will be adjusted later based on performance
  resources:
    requests:
      cpu: "24"
      memory: "48Gi"
    limits:
      cpu: "32"
      memory: "64Gi"

# Disable Redis since we're using Milvus
redis-vector-db:
  enabled: false

# Enable and configure Milvus as the vector database
milvus:
  enabled: true
  # Default Milvus standalone port
  port: 19530
  # Use standalone mode for simpler deployment
  cluster:
    enabled: false
  # Standalone Milvus configuration
  standalone:
    resources:
      requests:
        memory: "4Gi"  # Increased from 2Gi
        cpu: "2"       # Increased from 1
      limits:
        memory: "8Gi"  # Increased from 4Gi
        cpu: "4"       # Increased from 2
    persistence:
      enabled: false  # For testing. Enable for production with proper storage
    # Security context for OpenShift compatibility
    securityContext:
      fsGroup: 1001080000
    podSecurityContext:
      fsGroup: 1001080000
    containerSecurityContext:
      runAsUser: 1001080000
      runAsNonRoot: true
      runAsGroup: 1001080000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    # Fixed imagePullSecrets format
    imagePullSecrets:
      - name: regcred
  etcd:
    replicaCount: 1
    persistence:
      enabled: false
    securityContext:
      fsGroup: 1001080000
    podSecurityContext:
      fsGroup: 1001080000
    containerSecurityContext:
      runAsUser: 1001080000
      runAsNonRoot: true
      runAsGroup: 1001080000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    # Fixed imagePullSecrets format
    imagePullSecrets:
      - name: regcred
  pulsar:
    enabled: false
  minio:
    mode: standalone
    persistence:
      enabled: false
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    # Security context for OpenShift compatibility
    securityContext:
      fsGroup: 1001080000
    podSecurityContext:
      fsGroup: 1001080000
    containerSecurityContext:
      runAsUser: 1001080000
      runAsNonRoot: true
      runAsGroup: 1001080000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    # Fixed imagePullSecrets format
    imagePullSecrets:
      - name: regcred
    # Configure MinIO service ports
    service:
      type: ClusterIP
      port: 9000
      nodePort: null
    # Disable TLS for testing
    tls:
      enabled: false
      certSecret: ""
      publicCrt: ""
      privateKey: ""
    # Set empty directory for certificates since we disabled TLS
    mountPath: "/tmp/minio"
    # Configure MinIO environment variables
    environment:
      MINIO_UPDATE: "off"
      MINIO_BROWSER: "on"
      MINIO_PROMETHEUS_AUTH_TYPE: "public"

# Configure data-prep service to use Milvus backend
data-prep:
  DATAPREP_BACKEND: "MILVUS"
  COLLECTION_NAME: "rag_milvus"
  # Default data-prep service port
  service:
    port: 6007

# Configure retriever service to use Milvus backend
retriever-usvc:
  RETRIEVER_BACKEND: "MILVUS"
  COLLECTION_NAME: "rag_milvus"
  # Default retriever service port
  service:
    port: 7000

# Enable TEI embedding and reranking services
tei:
  enabled: true
  port: 2081
teirerank:
  enabled: true
  port: 2082

# Configure UI with RedHat-compatible image
chatqna-ui:
  image:
    # modified image for redhat security
    repository: edlee123/chatqna-ui
    tag: "latest"
  containerPort: 5173

# Main chatqna configuration (megaservice)
image:
  repository: opea/chatqna
  tag: "1.2"

# Add security context and volumes for npm cache
# We'd resolved this for the chatqna-ui and this
# is for the megaservice chatqna.
podSecurityContext:
  fsGroup: 1001080000
securityContext:
  runAsUser: 1001080000
  runAsGroup: 1001080000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# Add volume mount for npm cache
volumeMounts:
  - name: npm-cache
    mountPath: /.npm
volumes:
  - name: npm-cache
    emptyDir: {}
